<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Демонстрация изменения горизонтальной линии</title>
    <script src = Task7.js></script>
    <link href="Task7.css" rel="stylesheet">
</head>
<body>
<h1> Горизонтальные линии</h1>
<div>
    <p> Выберите значения параметров, которые требуются изменить, и нажмите кнопку <b> Выполнить </b> </p>
</div>
<div class = "line-container">
    <div class="horizontal-line"> </div>
</div>

<table>
    <tr>
        <td>
           <b > Выравнивание </b> <br>
            <input type="radio" id="left_radio" value="left" name = "align" > <label> LEFT </label> <br>
            <input type="radio" id="center_radio" value="center" name = "align" checked> <label> CENTER </label> <br>
            <input type="radio" id="right_radio" value="right" name = "align"> <label> RIGHT </label> <br>
            <input type="number" id="size_input"> <label> Толщина линии (size)</label> <br>
            <input type="number" id="width_input" > <label for="width_input"> Длина линии (width) </label> <br>
        </td>
        <td>
            <label > Цвет линии (color) </label>
            <select id = "color_input">
                <option value="black">black</option>
                <option value="teal">teal</option>
                <option value="green">green</option>
                <option value="olive">olive</option>
                <option value="navy">navy</option>
                <option value="purple">purple</option>
                <option value="gray">gray</option>
                <option value="silver">silver</option>
                <option value="yellow">yellow</option>
                <option value="blue">blue</option>
                <option value="fuchsia">fuchsia</option>
                <option value="white">white</option>
            </select>
        </td>
    </tr>
</table >
<div class="buttons-container">
    <button  onclick="change()"> Выполнить </button>
    <button onclick="reset()"> Обновить </button>
</div>
</body>
</html>

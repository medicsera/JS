<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приветствие</title>
    <link href="main.css" rel="stylesheet">
</head>
<body>
<div id="welcome-screen">
    <h1 id="hello">Привет, ты же.. </h1> <h1> <span id="random-name"> Лейла </span>?</h1>
    <button onclick="showAnimalSelection()">Это я!!!</button>
    <button onclick="fetchRandomName()">Нет..</button>
</div>

<div id="animal-selection" class="hidden">
    <h2>Выберите животное:</h2>
    <button onclick="selectAnimal('cat')">Кошка</button>
    <button onclick="selectAnimal('dog')">Собака</button>
    <button onclick="selectAnimal('fox')">Лиса</button> <br>
    <button onclick="returnToName()">Назад</button>
</div>

<div id="animal-info" class="hidden">

    <h2>Информация о животном</h2>
    <p id="fact"></p>
    <img id="animal-image" referrerpolicy="no-referrer" /> <br>
    <button onclick="goBackToSelection()">Назад</button>
</div>


<script src="main.js"></script>
</body>
</html>
